<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Willovate Store — considered goods for modern everyday life."
    />
    <meta name="theme-color" content="#f6f4ee" />
    <title>Willovate Store</title>
    <script>
      (function () {
        function isSuppressed(str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.indexOf('reportAllChanges') !== -1 ||
            s.indexOf('startTime') !== -1 ||
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            s.indexOf('safari-extension://') !== -1
          );
        }

        function shouldSuppress(msg, src, err) {
          return (
            isSuppressed(msg) ||
            isSuppressed(src) ||
            (err && (isSuppressed(err.message) || isSuppressed(err.stack)))
          );
        }

        // 1. Guard PerformanceObserver against web-vitals extension callback crashes
        if (typeof window !== 'undefined' && typeof window.PerformanceObserver === 'function') {
          try {
            var NativeObserver = window.PerformanceObserver;
            var SafeObserver = function (callback) {
              var safeCallback = function (list, observer) {
                try {
                  return callback(list, observer);
                } catch (e) {
                  if (!isSuppressed(e && (e.message || e.stack))) {
                    throw e;
                  }
                }
              };
              return new NativeObserver(safeCallback);
            };
            SafeObserver.prototype = NativeObserver.prototype;
            SafeObserver.supportedEntryTypes = NativeObserver.supportedEntryTypes;
            window.PerformanceObserver = SafeObserver;
          } catch (e) {}
        }

        // 2. Suppress unhandled error events
        window.addEventListener(
          'error',
          function (event) {
            if (shouldSuppress(event.message, event.filename, event.error)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          },
          true
        );

        window.onerror = function (msg, src, line, col, err) {
          if (shouldSuppress(msg, src, err)) {
            return true;
          }
        };

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason ? event.reason.stack || event.reason.message || String(event.reason) : '';
            if (isSuppressed(reason)) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        // 3. Filter console.error logs
        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg && (isSuppressed(arg) || (arg.stack && isSuppressed(arg.stack)) || (arg.message && isSuppressed(arg.message)))) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
